[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finpipe"
version = "0.1.6"
description = "可追溯的财报数据处理与特征工程"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "requests>=2.31", "pyarrow>=15", "filelock>=3.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
build = ["pyinstaller>=6"]

[project.scripts]
finpipe = "finpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finpipe = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
